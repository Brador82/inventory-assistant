<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Units — Inventory Assistant</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
  <button class="header-back" onclick="window.location='index.html'">←</button>
  <div>
    <div class="header-logo" id="pageTitle">Units</div>
    <div class="header-sub" id="pageSub"></div>
  </div>
</div>

<div class="page">

  <div class="field">
    <select id="statusFilter" onchange="load()">
      <option value="">All Units</option>
      <option>Intake</option>
      <option>Testing</option>
      <option>Diagnose</option>
      <option>WaitingForParts</option>
      <option>Repairing</option>
      <option>ReadyForFloor</option>
      <option>OnSalesFloor</option>
      <option>HeldForCustomer</option>
      <option>Sold</option>
      <option>WaitingForDelivery</option>
      <option>Delivered</option>
      <option>Return</option>
      <option>Scrap</option>
    </select>
  </div>

  <div id="list"><div class="loading">Loading…</div></div>

</div>

<a href="scan.html" class="fab">📷</a>

<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
const preStatus = params.get('status') || '';

if (preStatus) {
  document.getElementById('statusFilter').value = preStatus;
  document.getElementById('pageTitle').textContent = preStatus;
}

async function load() {
  const status = document.getElementById('statusFilter').value;
  const url = status ? `/api/units?status=${encodeURIComponent(status)}` : '/api/units';
  document.getElementById('pageTitle').textContent = status || 'All Units';
  try {
    const units = await apiGet(url);
    document.getElementById('pageSub').textContent = `${units.length} unit${units.length !== 1 ? 's' : ''}`;
    if (!units.length) {
      document.getElementById('list').innerHTML = '<div class="info-msg">No units found.</div>';
      return;
    }
    document.getElementById('list').innerHTML = units.map(u => `
      <a href="unit.html?barcode=${encodeURIComponent(u.barcode)}" class="list-item">
        <div class="list-item-left">
          <div class="list-item-barcode">${u.barcode}</div>
          <div class="list-item-sub">${[u.brand, u.applianceType, u.model].filter(Boolean).join(' · ')}</div>
          ${u.heldFor ? `<div class="list-item-sub" style="color:var(--accent)">Held: ${u.heldFor}</div>` : ''}
        </div>
        <div class="list-item-right">
          ${statusBadge(u.status)}
          <div style="font-size:10px;color:var(--text-muted);margin-top:4px">${fmtDate(u.updatedAt)}</div>
        </div>
      </a>
    `).join('');
  } catch(e) {
    document.getElementById('list').innerHTML = `<div class="error-msg">${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
